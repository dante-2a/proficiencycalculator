<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dante's proficiency calculator</title>
  
  <link rel="icon" type="image/png" href="rivals11.png">

  <style>
    :root {
      --bg-color: #0f141c;
      --card-bg: #1a222f;
      --accent-color: #d6335c;
      --accent-hover: #b82347;
      --text-color: #e0e6ed;
      --border-color: #2e3a4e;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .calculator-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
      color: var(--accent-color);
      text-transform: lowercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: lowercase;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #111722;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: var(--accent-color);
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
      text-transform: lowercase;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .result-box {
      margin-top: 24px;
      padding: 20px;
      border-radius: 8px;
      background: #111722;
      border: 1px solid var(--border-color);
      text-align: center;
      display: none;
    }

    .tier-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
    }

    .tier-badge {
      width: 84px;
      height: 84px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .tier-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
      text-transform: lowercase;
      letter-spacing: 1px;
    }

    .result-title {
      font-size: 0.85rem;
      color: #8fa0b5;
      margin-bottom: 6px;
      text-transform: lowercase;
    }

    .result-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .points-breakdown {
      font-size: 0.85rem;
      color: #8fa0b5;
      margin-top: 6px;
    }

    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: #2e3a4e;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 14px;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent-color);
      width: 0%;
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <h1>dante's proficiency calculator</h1>

    <div class="form-group">
      <label for="currentLevel">current level</label>
      <input type="number" id="currentLevel" placeholder="e.g. 12" min="1" max="70" value="12">
    </div>

    <div class="form-group">
      <label for="currentExp">current points</label>
      <input type="number" id="currentExp" placeholder="e.g. 200" min="0" value="200">
    </div>

    <div class="form-group">
      <label for="targetLevel">target level</label>
      <input type="number" id="targetLevel" placeholder="e.g. 20" min="2" max="70" value="20">
    </div>

    <button onclick="calculateProgress()">calculate progress :3</button>

    <div class="result-box" id="resultBox">
      <div class="tier-container">
        <img id="tierBadge" class="tier-badge" src="" alt="tier badge">
        <div id="tierName" class="tier-name"></div>
      </div>

      <div class="result-title">progress toward target</div>
      <div class="result-value" id="percentDisplay">0%</div>
      <div class="points-breakdown" id="pointsDisplay">0 / 0 proficiency</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <script>
    function getTierInfo(l) {
      if (l <= 4) return { name: "agent", img: "rivals1.png" };
      if (l <= 9) return { name: "knight", img: "rivals2.png" };
      if (l <= 14) return { name: "captain", img: "rivals3.png" };
      if (l <= 19) return { name: "centurion", img: "rivals4.png" };
      if (l <= 24) return { name: "lord", img: "rivals5.png" };
      if (l <= 29) return { name: "count", img: "rivals6.png" };
      if (l <= 34) return { name: "colonel", img: "rivals7.png" };
      if (l <= 39) return { name: "warrior", img: "rivals8.png" };
      if (l <= 44) return { name: "elite", img: "rivals9.png" };
      if (l <= 49) return { name: "guardian", img: "rivals10.png" };
      return { name: "champion", img: "rivals11.png" };
    }

    function j(l) {
      if (l < 5) return 0;
      if (l < 10) return 500;
      if (l < 15) return 1700;
      if (l < 20) return 3700;
      if (l < 50) return 6100;
      return 54100;
    }

    function k(l) {
      if (l < 5) return 1;
      if (l < 10) return 5;
      if (l < 15) return 10;
      if (l < 20) return 15;
      if (l < 50) return 20;
      return 50;
    }

    function v(l) {
      if (l < 5) return 125;
      if (l < 10) return 240;
      if (l < 15) return 400;
      if (l < 20) return 480;
      if (l < 50) return 1600;
      return 3100;
    }

    function calculateTotalProficiency(l, p) {
      return p + (j(l) + ((l - k(l)) * v(l)));
    }

    function calculateProgress() {
      const currentLevel = parseInt(document.getElementById('currentLevel').value) || 1;
      const currentExp = parseInt(document.getElementById('currentExp').value) || 0;
      const targetLevel = parseInt(document.getElementById('targetLevel').value) || 1;

      if (targetLevel <= currentLevel) {
        alert("Target level must be higher than your current level.");
        return;
      }

      const currentTotal = calculateTotalProficiency(currentLevel, currentExp);
      const targetTotal = calculateTotalProficiency(targetLevel, 0);

      let percentage = (currentTotal / targetTotal) * 100;
      percentage = Math.min(Math.max(percentage, 0), 100);

      const tierInfo = getTierInfo(targetLevel);

      const resultBox = document.getElementById('resultBox');
      const tierBadge = document.getElementById('tierBadge');
      const tierName = document.getElementById('tierName');
      const percentDisplay = document.getElementById('percentDisplay');
      const pointsDisplay = document.getElementById('pointsDisplay');
      const progressBar = document.getElementById('progressBar');

      tierBadge.src = tierInfo.img;
      tierBadge.alt = tierInfo.name;
      tierName.innerText = tierInfo.name;

      resultBox.style.display = 'block';
      percentDisplay.innerText = percentage.toFixed(2) + '%';
      pointsDisplay.innerText = `${currentTotal.toLocaleString()} / ${targetTotal.toLocaleString()} total proficiency`;
      progressBar.style.width = percentage + '%';
    }
  </script>

</body>
</html>
